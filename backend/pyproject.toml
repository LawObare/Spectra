[project]
name = "spectra-backend"
version = "0.1.0"
description = "Spectra Unified FastAPI Science Engine"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "astropy>=6.1.3",
    "asyncpg",
    "cachetools",
    "fastapi>=0.115.0",
    "fsspec>=2024.6.1",
    "httpx",
    "numpy>=2.1.1",
    "pillow>=10.4.0",
    "pyvo>=1.5.2",
    "reproject>=0.14.0",
    "requests>=2.32.3",
    "s3fs>=2024.6.1",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.1",
    "torch>=2.4.0",
    "uvicorn[standard]",
    "uvloop",
    "zstandard",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
